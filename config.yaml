# =============================================================================
# CeramicSpeed — Configuration
# =============================================================================
# Shared by all scripts. Load via ceramicspeed.config.load_config().
# To run a variant: python script.py --config my_variant.yaml

# =============================================================================
# Paths (machine-specific)
# =============================================================================

machines:
  work:
    home: "C:/Users/au808956"
    paths:
      input_dir:  "C:/Users/au808956/Documents/Repos/publication-ceramicspeed-dataset/data/"
      output_dir: "C:/Users/au808956/Documents/Repos/publication-ceramicspeed-dataset/outputs/"
  home:
    home: "C:/Users/Bruger"
    paths:
      input_dir:  "C:/Users/Bruger/Documents/Repos/publication-ceramicspeed-dataset/data/"
      output_dir: "C:/Users/Bruger/Documents/Repos/publication-ceramicspeed-dataset/outputs/"
  favn:
    home: "C:/Users/favn"
    paths:
      input_dir:  "C:/Users/favn/Documents/Repos/publication-ceramicspeed-dataset/data/"
      output_dir: "C:/Users/favn/Documents/Repos/publication-ceramicspeed-dataset/outputs/"

paths:  # fallback if no machine matched
  input_dir:  "C:/Users/Bruger/Documents/Repos/publication-ceramicspeed-dataset/data/"
  output_dir: "C:/Users/Bruger/Documents/Repos/publication-ceramicspeed-dataset/outputs/"

# =============================================================================
# Bearing geometry
# =============================================================================

bearing:
  d_pw_mm: 38.0            # mean pitch diameter [mm]

# =============================================================================
# Data loading & filtering
# =============================================================================

filters:
  rpm_min: 50              # discard sweeps below this RPM (startup transients)
  rpm_max: 3_600         # raised from 3000 after VFD-based speed reconstruction: the 60 Hz rail delivers ~3570 rpm
  temp_min: 38             # discard sub-floor cold-start (measured temp dips to 33C before the controller settles at the 40C floor)
  file_patterns:
    - "scope_20260817_114548"

signal_cleaning:
  enabled: true
  fix_nan_inf: true
  check_clipping: false
  check_saturation: false
  remove_outliers_z: null   # null = disabled; set e.g. 6.0 to enable spike removal
  reject_clipped: false
  reject_saturated: false

# =============================================================================
# Signal processing
# =============================================================================

welch:
  nperseg:  4096
  noverlap: 2048
  window:   "hann"

sensors:
  AE:
    f_min: 50_000
    f_max: 600_000     # Kistler 5125C coupler high-passes at 50 kHz before
                       # digitisation; raw spectrogram inspection (2026-08-18,
                       # dev/exploration/eda_spectrogram.py on scope_20260817)
                       # confirms real, kappa-dependent AE content in
                       # 50-600 kHz. A persistent ~20-30 kHz band exists below
                       # 50 kHz but doesn't track kappa/operating condition and
                       # isn't attributable to a known mechanism, so it's
                       # excluded. Above 600 kHz, content falls to the noise
                       # floor aside from a fixed ~980 kHz electronic tone
                       # (doesn't track kappa either) — excluded too.
  UL:
    f_min: 0
    f_max: 40_000      # Raw spectrogram inspection (2026-08-18,
                       # dev/exploration/eda_spectrogram.py on scope_20260817)
                       # shows real content spans ~0-30 kHz (strongest below
                       # 8 kHz), with the clearest kappa-dependence in
                       # 10-16 kHz. Above ~30 kHz content falls to the noise
                       # floor, so the broadband/prefilter is capped at 40 kHz.

band_width_hz: 100_000

# Restrict broadband features to each sensor's effective bandwidth.
# UL is heterodyned to <20 kHz — without this, spectral features are
# dominated by out-of-band noise across the full ~5 MHz DAQ bandwidth.
sensor_prefilter:
  AE: {f_lo: 50_000, f_hi: 600_000}
  UL: {f_lo: 0, f_hi: 40_000}

# Additional feature set per frequency band.
# UL bands operate on the prefiltered (0–40 kHz) signal.
frequency_bands:
  AE:
    - {f_lo:       50_000, f_hi:    200_000, label: "AE_50-200kHz"}
    - {f_lo:      200_000, f_hi:    600_000, label: "AE_200-600kHz"}
  UL:
    - {f_lo:      0, f_hi:  16_000, label: "US_0-16kHz"}
    - {f_lo: 16_000, f_hi:  40_000, label: "US_16-40kHz"}

# Bands characterised by the validation scripts (08/10) but EXCLUDED from
# feature extraction and modelling. Keeps the >1 MHz region documented.
validation_extra_bands:
  AE:
    - {f_lo: 1_000_000, f_hi: 2_000_000, label: "AE_1000-2000kHz"}

# =============================================================================
# Kappa regime boundaries  (EDA visualisation + feature binning)
# =============================================================================

kappa:
  boundaries: [0.5, 1.0]
  labels:     ["κ < 0.5", "0.5 < κ < 1", "1 ≤ κ"]
  # Single-hue ordinal ramp (dark = low kappa -> light = high kappa), matching
  # the low=dark/high=light convention already used by the viridis scatter in
  # plot_operating_conditions(). Replaces a red/orange/green traffic-light
  # scheme that failed CVD validation (green vs orange ΔE=0.7 under
  # protanopia -- see dataviz skill, scripts/validate_palette.js). This
  # 3-step ramp passes all ordinal checks (--ordinal --pairs all).
  colors:     ["#104281", "#2a78d6", "#86b6ef"]

# =============================================================================
# EDA — manual sweep selection  (eda_spectra.py)
# =============================================================================

# List specific sweep names to inspect. Omit or leave empty to use N_SWEEPS.
# Re-picked 2026-08-25 for the current dataset (scope_20260817_114548.h5,
# corrected cmd_hz-based speed, target=100 excluded) -- the previous
# selection referenced sweep_8465, which doesn't exist in this smaller
# (~4220-sweep) file, and kappa values computed on the old (April) dataset.
sweep_selection:
  # Low kappa (~0.05-0.19): very different RPM (200 vs 1100), similar temp (~100°C)
  - sweep_4217
  - sweep_3967
  # High kappa (~1.13-1.62): very different RPM (1400 vs 2900), same temp (40°C)
  - sweep_081
  - sweep_173

# =============================================================================
# Feature analysis & selection
# =============================================================================

feature_selection:
  corr_min: 0.1        # Minimum |Spearman ρ| AND |Pearson r| required to retain a feature
  vif_threshold: 5  # Features with VIF above this are candidates for greedy removal

# =============================================================================
# Evaluation
# =============================================================================

evaluation:
  shap_top_k: 5  # Number of top features per model for cross-model SHAP agreement tables

# =============================================================================
# Modelling
# =============================================================================

random_state: 42

modelling:
  grouped_split: true   # split train/holdout and CV folds by staircase hold

  test_size:   0.2
  cv_n_splits: 5
  n_repeats:   5      # repeated-CV repeats (full: 10)

  elastic_net:
    alphas:    [0.0001, 0.001, 0.01, 0.1, 0.5, 1.0, 5.0, 10.0, 100.0]
    l1_ratios: [0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
    max_iter:  10000

  polynomial:
    degree: 2
    top_k:  5      # restrict to top-k features by |r| before expansion
    alphas: null

  lightgbm:
    n_estimators:        500
    learning_rate:       0.05
    max_depth:           6
    num_leaves:          31
    min_child_samples:   10
    subsample:           0.8
    colsample_bytree:    0.8
    reg_alpha:           0.0
    reg_lambda:          1.0
    early_stopping_rounds: 50
    n_trials:            20    # Optuna trials per study (outer fold + final model)
    param_grid:
      learning_rate: [0.01, 0.05, 0.1]
      num_leaves:    [15, 31, 63]
      max_depth:     [4, 6, -1]

# =============================================================================
# Debug / fast mode  (activated via --debug flag or debug.enabled: true)
# =============================================================================
# Override heavy parameters for quick sanity checks.
# Full values are in the modelling section above.

debug:
  enabled:               False  # set true to always run in debug mode
  cv_n_splits:           3      # outer folds  (full: 5)
  n_trials:              2      # Optuna trials per LightGBM fold  (full: 50)
  n_estimators:          40     # LightGBM max trees  (full: 500)
  early_stopping_rounds: 10     # LightGBM early stop  (full: 50)
  n_repeats:             2      # repeated-CV repeats in 04_evaluation  (full: 10)
  n_boot:                200    # bootstrap resamples in 04_evaluation  (full: 10000)
