<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <rect width="1200" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Test rig -->
  <rect x="20" y="210" width="110" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="75" y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Test rig</text>

  <line x1="130" y1="220" x2="178" y2="168" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="130" y1="232" x2="178" y2="284" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- AE sensor -->
  <rect x="180" y="140" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="255" y="161" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">AE sensor</text>
  <text x="255" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Acoustic emission</text>

  <!-- US sensor -->
  <rect x="180" y="256" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="255" y="277" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">US sensor</text>
  <text x="255" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Ultrasound signal</text>

  <line x1="330" y1="168" x2="378" y2="168" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <line x1="330" y1="284" x2="378" y2="284" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow-teal)"/>

  <!-- AE features -->
  <rect x="380" y="140" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="460" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">AE features</text>
  <text x="460" y="177" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Time, frequency domain</text>

  <!-- US features -->
  <rect x="380" y="256" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="460" y="274" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">US features</text>
  <text x="460" y="293" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Time, frequency domain</text>

  <line x1="540" y1="158" x2="588" y2="115" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <path d="M540 175 L564 175 L564 232 L588 232" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M540 274 L564 274 L564 232 L588 232" fill="none" stroke="#888780" stroke-width="1"/>
  <line x1="540" y1="274" x2="588" y2="345" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow-teal)"/>

  <!-- AE-only model -->
  <rect x="590" y="88" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="665" y="109" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">AE-only model</text>
  <text x="665" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">AE features alone</text>

  <!-- Feature fusion -->
  <rect x="590" y="204" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="665" y="225" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Feature fusion</text>
  <text x="665" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Joint AE + US</text>

  <!-- US-only model -->
  <rect x="590" y="318" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="665" y="339" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">US-only model</text>
  <text x="665" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">US features alone</text>

  <path d="M740 116 L780 116 L780 248 L808 248" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <line x1="740" y1="232" x2="808" y2="232" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M740 346 L780 346 L780 248 L808 248" fill="none" stroke="#0F6E56" stroke-width="1"/>

  <!-- Nested CV -->
  <rect x="810" y="210" width="90" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="855" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Nested</text>
  <text x="855" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">CV</text>

  <line x1="900" y1="238" x2="928" y2="238" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ML models -->
  <rect x="930" y="196" width="112" height="84" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="986" y="222" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">ML models</text>
  <text x="986" y="241" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Elastic net</text>
  <text x="986" y="257" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Polynomial</text>
  <text x="986" y="273" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">LightGBM</text>

  <line x1="1042" y1="238" x2="1068" y2="238" stroke="#993C1D" stroke-width="1" marker-end="url(#arrow-coral)"/>

  <!-- kappa prediction -->
  <rect x="1070" y="210" width="110" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="1125" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">&#954; prediction</text>
  <text x="1125" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Viscosity ratio</text>

  <line x1="1125" y1="266" x2="1125" y2="294" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow-amber)"/>

  <!-- Evaluation -->
  <rect x="1070" y="296" width="110" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="1125" y="317" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">Evaluation</text>
  <text x="1125" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">R&#178;, MAE, RMSE</text>

</svg>
